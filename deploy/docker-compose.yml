services:
  luckytodo-api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    container_name: luckytodo-api
    restart: unless-stopped
    ports:
      - "8787:8787"
    environment:
      PORT: "8787"
      LUCKYTODO_DATA: /data
      LUCKYTODO_WEB: /app/apps/web
      # AI 洞察（可选；也可在浏览器打开 /admin.html 或 App「我的」由管理员覆盖）
      AI_ENABLED: ${AI_ENABLED:-false}
      AI_BASE_URL: ${AI_BASE_URL:-}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-deepseek-chat}
      # 默认 12 小时 = 43200000 ms
      INSIGHT_INTERVAL_MS: ${INSIGHT_INTERVAL_MS:-43200000}
      LUCKYTODO_TEST_OTP: ${LUCKYTODO_TEST_OTP:-123456}
      LUCKYTODO_SMS_WEBHOOK: ${LUCKYTODO_SMS_WEBHOOK:-}
      LUCKYTODO_OBJECT_STORE: ${LUCKYTODO_OBJECT_STORE:-local}
    volumes:
      - luckytodo_data:/data

volumes:
  luckytodo_data:
