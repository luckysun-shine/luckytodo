<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>LuckyTodo 服务管理</title>
  <style>
    :root {
      --bg: #0c1219;
      --card: #12233a;
      --line: rgba(255,255,255,.08);
      --text: #e8eef7;
      --muted: #8fa3bd;
      --accent: #4d8fff;
      --danger: #ff7b72;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh;
      font-family: "SF Pro Text", "PingFang SC", "Noto Sans SC", sans-serif;
      background: radial-gradient(1200px 600px at 10% -10%, #163356, var(--bg));
      color: var(--text);
    }
    main { max-width: 560px; margin: 0 auto; padding: 32px 20px 64px; }
    h1 { font-size: 1.5rem; letter-spacing: -.02em; margin: 0 0 8px; }
    .sub { color: var(--muted); font-size: .9rem; margin-bottom: 28px; line-height: 1.5; }
    .card {
      background: color-mix(in srgb, var(--card) 92%, white 2%);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 18px;
      margin-bottom: 16px;
    }
    label { display: block; font-size: .8rem; color: var(--muted); margin: 12px 0 6px; }
    input[type=text], input[type=password], input[type=url] {
      width: 100%; padding: 12px 14px; border-radius: 12px;
      border: 1px solid var(--line); background: #0c1a2d; color: var(--text);
      font-size: 1rem;
    }
    .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    .btn {
      appearance: none; border: 0; border-radius: 12px; padding: 12px 16px;
      background: var(--accent); color: #04201c; font-weight: 650; cursor: pointer;
    }
    .btn.secondary { background: #1c314d; color: var(--text); }
    .btn.ghost { background: transparent; color: var(--muted); border: 1px solid var(--line); }
    .btn:disabled { opacity: .5; cursor: not-allowed; }
    .err { color: var(--danger); font-size: .85rem; margin-top: 10px; }
    .ok { color: var(--accent); font-size: .85rem; margin-top: 10px; }
    .muted { color: var(--muted); font-size: .85rem; line-height: 1.45; }
    .switch { display: flex; align-items: center; gap: 10px; margin-top: 8px; }
    code { font-size: .8rem; background: #0c1a2d; padding: 2px 6px; border-radius: 6px; }
  </style>
</head>
<body>
<main>
  <h1>LuckyTodo 服务管理</h1>
  <p class="sub">轻量运维页：配置家庭服务器上的 AI 洞察模型。不是完整后台；成员/待办仍在 App 内管理。<br/>也可在 Docker 环境变量中预设 <code>AI_BASE_URL</code> / <code>AI_API_KEY</code> / <code>AI_MODEL</code>。</p>

  <section class="card" id="loginCard">
    <h2 style="margin:0 0 4px;font-size:1.05rem">管理员登录</h2>
    <p class="muted">使用家庭管理员账号（与 App 相同）。</p>
    <label>用户名</label>
    <input id="username" type="text" autocomplete="username" />
    <label>密码</label>
    <input id="password" type="password" autocomplete="current-password" />
    <div class="row" style="margin-top:16px">
      <button class="btn" id="loginBtn" type="button">登录</button>
    </div>
    <p class="err" id="loginErr" hidden></p>
  </section>

  <section class="card" id="settingsCard" hidden>
    <div class="row" style="justify-content:space-between">
      <h2 style="margin:0;font-size:1.05rem">AI 洞察模型</h2>
      <button class="btn ghost" id="logoutBtn" type="button">退出</button>
    </div>
    <p class="muted" id="who"></p>
    <div class="switch">
      <input id="enabled" type="checkbox" />
      <label for="enabled" style="margin:0">启用定时 AI 洞察（约每 12 小时）</label>
    </div>
    <label>API Base URL（OpenAI 兼容，勿带 /chat/completions）</label>
    <input id="baseUrl" type="url" placeholder="https://api.deepseek.com/v1" />
    <label>API Key（留空表示不修改已保存密钥）</label>
    <input id="apiKey" type="password" placeholder="sk-..." autocomplete="off" />
    <label>模型名</label>
    <input id="model" type="text" placeholder="deepseek-chat" />
    <div class="row" style="margin-top:16px">
      <button class="btn" id="saveBtn" type="button">保存配置</button>
      <button class="btn secondary" id="runBtn" type="button">立即生成洞察</button>
    </div>
    <p class="ok" id="saveOk" hidden></p>
    <p class="err" id="saveErr" hidden></p>
  </section>

  <section class="card" id="reportCard" hidden>
    <h2 style="margin:0 0 8px;font-size:1.05rem">最近洞察</h2>
    <p class="muted" id="reportMeta">尚未生成</p>
    <div id="reportCards"></div>
  </section>
</main>
<script>
  const state = { token: localStorage.getItem('lt_admin_token') || '', member: null };

  const $ = (id) => document.getElementById(id);
  function show(el, on) { el.hidden = !on; }
  function api(method, path, body) {
    return fetch(path, {
      method,
      headers: {
        ...(body ? { 'Content-Type': 'application/json' } : {}),
        ...(state.token ? { Authorization: 'Bearer ' + state.token } : {}),
      },
      body: body ? JSON.stringify(body) : undefined,
    }).then(async (res) => {
      const json = await res.json().catch(() => ({}));
      if (!res.ok) throw Object.assign(new Error(json.error || res.statusText), { status: res.status, json });
      return json;
    });
  }

  async function loadSettings() {
    const { settings } = await api('GET', '/api/settings/ai');
    $('enabled').checked = !!settings.enabled;
    $('baseUrl').value = settings.baseUrl || '';
    $('model').value = settings.model || '';
    $('apiKey').value = '';
    $('apiKey').placeholder = settings.apiKeySet ? '已保存密钥（留空不修改）' : 'sk-...';
    $('who').textContent = (state.member?.displayName || '') + ' · 配置来源 ' + (settings.source === 'db' ? '数据库' : '环境变量默认');
  }

  async function loadReport() {
    const data = await api('GET', '/api/insights/latest');
    const report = data.report;
    if (!report) {
      $('reportMeta').textContent = '尚未生成。可点「立即生成洞察」或等待定时任务。';
      $('reportCards').innerHTML = '';
      return;
    }
    $('reportMeta').textContent =
      '生成于 ' + new Date(report.generatedAt).toLocaleString('zh-CN', { hour12: false }) +
      ' · 状态 ' + report.status +
      (report.model ? ' · ' + report.model : '') +
      (report.error ? ' · ' + report.error : '');
    $('reportCards').innerHTML = (report.cards || []).map((c) =>
      '<article style="margin-top:12px;padding-top:12px;border-top:1px solid var(--line)"><strong>' +
      escapeHtml(c.tag) + ' · ' + escapeHtml(c.title) +
      '</strong><p class="muted" style="margin:6px 0 0">' + escapeHtml(c.body) + '</p></article>'
    ).join('');
  }

  function escapeHtml(s) {
    return String(s || '').replace(/[&<>"']/g, (ch) => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    })[ch]);
  }

  async function enterApp() {
    show($('loginCard'), false);
    show($('settingsCard'), true);
    show($('reportCard'), true);
    await loadSettings();
    await loadReport();
  }

  $('loginBtn').onclick = async () => {
    $('loginErr').hidden = true;
    try {
      const res = await api('POST', '/api/auth/login', {
        username: $('username').value.trim(),
        password: $('password').value,
        deviceName: 'admin-web',
      });
      if (res.member.role !== 'admin') throw new Error('请使用家庭管理员账号');
      state.token = res.token;
      state.member = res.member;
      localStorage.setItem('lt_admin_token', res.token);
      await enterApp();
    } catch (e) {
      $('loginErr').hidden = false;
      $('loginErr').textContent = e.message;
    }
  };

  $('logoutBtn').onclick = () => {
    state.token = '';
    localStorage.removeItem('lt_admin_token');
    show($('settingsCard'), false);
    show($('reportCard'), false);
    show($('loginCard'), true);
  };

  $('saveBtn').onclick = async () => {
    $('saveOk').hidden = true;
    $('saveErr').hidden = true;
    try {
      await api('PUT', '/api/settings/ai', {
        enabled: $('enabled').checked,
        baseUrl: $('baseUrl').value.trim(),
        model: $('model').value.trim(),
        apiKey: $('apiKey').value,
      });
      $('saveOk').hidden = false;
      $('saveOk').textContent = '已保存';
      await loadSettings();
    } catch (e) {
      $('saveErr').hidden = false;
      $('saveErr').textContent = e.message;
    }
  };

  $('runBtn').onclick = async () => {
    $('saveOk').hidden = true;
    $('saveErr').hidden = true;
    $('runBtn').disabled = true;
    try {
      await api('POST', '/api/insights/run');
      $('saveOk').hidden = false;
      $('saveOk').textContent = '已生成最新洞察';
      await loadReport();
    } catch (e) {
      $('saveErr').hidden = false;
      $('saveErr').textContent = e.message;
      if (e.json?.report) await loadReport();
    } finally {
      $('runBtn').disabled = false;
    }
  };

  if (state.token) {
    api('GET', '/api/me')
      .then((me) => {
        if (me.member.role !== 'admin') throw new Error('not admin');
        state.member = me.member;
        return enterApp();
      })
      .catch(() => {
        localStorage.removeItem('lt_admin_token');
        state.token = '';
      });
  }
</script>
</body>
</html>
