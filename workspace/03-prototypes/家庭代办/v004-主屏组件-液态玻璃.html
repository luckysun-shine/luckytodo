<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LuckyTodo · 主屏组件（液态玻璃示意）</title>
  <style>
    :root {
      --glass: color-mix(in oklab, white 28%, transparent);
      --glass-dark: color-mix(in oklab, white 12%, transparent);
      --stroke: color-mix(in oklab, white 45%, transparent);
      --text: #f7f8fc;
      --text-2: color-mix(in oklab, white 72%, transparent);
      --accent: #5b8cff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100dvh; padding: 28px 18px 48px;
      font-family: "SF Pro Display", "SF Pro Text", "PingFang SC", system-ui, sans-serif;
      color: var(--text);
      background:
        radial-gradient(ellipse at 20% 10%, #6aa8ff 0%, transparent 45%),
        radial-gradient(ellipse at 80% 30%, #ff8ad4 0%, transparent 40%),
        radial-gradient(ellipse at 50% 90%, #7d5cff 0%, transparent 45%),
        linear-gradient(165deg, #1a2744, #0c1222 55%, #1c1430);
    }
    h1 { margin: 0 0 6px; font-size: 22px; letter-spacing: -0.03em; }
    .note { margin: 0 0 22px; color: var(--text-2); font-size: 13px; max-width: 52ch; }
    .wall { display: grid; gap: 18px; max-width: 420px; margin: 0 auto; }
    .glass {
      position: relative; overflow: hidden;
      border-radius: 28px;
      border: 1px solid var(--stroke);
      background: linear-gradient(145deg, var(--glass), var(--glass-dark));
      box-shadow:
        inset 0 1px 0 color-mix(in oklab, white 55%, transparent),
        inset 0 -1px 0 color-mix(in oklab, black 18%, transparent),
        0 18px 40px color-mix(in oklab, black 28%, transparent);
      backdrop-filter: blur(28px) saturate(160%);
      -webkit-backdrop-filter: blur(28px) saturate(160%);
    }
    .glass::before {
      content: "";
      position: absolute; inset: 0;
      background: linear-gradient(120deg, color-mix(in oklab, white 35%, transparent), transparent 35%, transparent 65%, color-mix(in oklab, white 12%, transparent));
      pointer-events: none; mix-blend-mode: soft-light;
    }
    .label { font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--text-2); margin: 0 0 8px; }
    .w-small { padding: 14px 16px; min-height: 88px; }
    .w-medium { padding: 16px; min-height: 160px; }
    .w-large { padding: 16px; min-height: 320px; }
    .row { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
    .title { margin: 0; font-size: 17px; font-weight: 650; letter-spacing: -0.02em; }
    .sub { margin: 4px 0 0; font-size: 13px; color: var(--text-2); }
    .pill {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 5px 10px; border-radius: 999px;
      background: color-mix(in oklab, white 16%, transparent);
      border: 1px solid color-mix(in oklab, white 28%, transparent);
      font-size: 12px;
    }
    .list { list-style: none; margin: 10px 0 0; padding: 0; display: grid; gap: 8px; }
    .list li {
      display: flex; align-items: center; gap: 10px;
      padding: 8px 10px; border-radius: 14px;
      background: color-mix(in oklab, white 10%, transparent);
    }
    .time { font-variant-numeric: tabular-nums; font-size: 12px; color: var(--text-2); width: 42px; flex: none; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 12px color-mix(in oklab, var(--accent) 70%, transparent); flex: none; }
    .cal {
      display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px;
      margin-top: 10px; font-size: 11px; text-align: center;
    }
    .cal b { color: var(--text-2); font-weight: 500; }
    .cal span {
      aspect-ratio: 1; display: grid; place-items: center; border-radius: 10px;
      color: var(--text);
    }
    .cal span.muted { color: color-mix(in oklab, white 35%, transparent); }
    .cal span.mark { background: color-mix(in oklab, var(--accent) 35%, transparent); }
    .cal span.sel {
      background: color-mix(in oklab, white 88%, transparent); color: #152038; font-weight: 700;
    }
    .add {
      margin-top: 12px; width: 100%; border: 0; border-radius: 16px; padding: 12px;
      font: inherit; font-weight: 600; color: #102038;
      background: color-mix(in oklab, white 82%, transparent);
      box-shadow: inset 0 1px 0 white;
      cursor: pointer;
    }
    .add:active { transform: scale(0.98); }
    .toast {
      position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%);
      padding: 10px 14px; border-radius: 14px; font-size: 13px;
      background: color-mix(in oklab, black 45%, transparent);
      border: 1px solid var(--stroke); backdrop-filter: blur(16px);
      opacity: 0; pointer-events: none; transition: opacity .2s;
    }
    .toast.show { opacity: 1; }
  </style>
</head>
<body>
  <div class="wall">
    <div>
      <h1>主屏组件 · 液态玻璃示意</h1>
      <p class="note">v004 规划预览：贴近系统液态玻璃质感。日历组件可在选中日期上直接添加；今日提醒展示今天的提醒列表。非正式 Widget，仅供视觉与交互示意。</p>
    </div>

    <div>
      <p class="label">今日提醒 · 小号</p>
      <section class="glass w-small">
        <div class="row">
          <div>
            <p class="title">20:00 阅读打卡</p>
            <p class="sub">今日还有 2 条提醒</p>
          </div>
          <span class="pill">提醒</span>
        </div>
      </section>
    </div>

    <div>
      <p class="label">今日提醒 · 中号</p>
      <section class="glass w-medium">
        <div class="row">
          <p class="title">今日提醒</p>
          <span class="pill">3</span>
        </div>
        <ul class="list">
          <li><span class="time">18:00</span><span class="dot"></span><span>交电费</span></li>
          <li><span class="time">20:00</span><span class="dot"></span><span>每天阅读 20 分钟</span></li>
          <li><span class="time">21:30</span><span class="dot"></span><span>准备明天书包</span></li>
        </ul>
      </section>
    </div>

    <div>
      <p class="label">家庭日历 · 大号（可添加）</p>
      <section class="glass w-large" id="cal">
        <div class="row">
          <p class="title">9 月</p>
          <span class="pill">林家</span>
        </div>
        <div class="cal" aria-label="月历">
          <b>一</b><b>二</b><b>三</b><b>四</b><b>五</b><b>六</b><b>日</b>
          <span class="muted">28</span><span class="muted">29</span><span class="muted">30</span><span class="muted">31</span>
          <span>1</span><span>2</span><span class="mark">3</span><span>4</span><span class="mark">5</span><span>6</span><span>7</span>
          <span>8</span><span>9</span><span>10</span><span>11</span><span class="sel" id="day">12</span><span>13</span><span>14</span>
          <span class="mark">15</span><span>16</span><span>17</span><span>18</span><span>19</span><span>20</span><span>21</span>
        </div>
        <ul class="list">
          <li><span class="time">15:00</span><span class="dot"></span><span>家长会</span></li>
        </ul>
        <button class="add" id="addBtn" type="button">在 12 日添加内容</button>
      </section>
    </div>
  </div>
  <div class="toast" id="toast">已记下（示意）</div>
  <script>
    const toast = document.getElementById('toast');
    document.getElementById('addBtn').addEventListener('click', () => {
      const title = prompt('标题', '接孩子');
      if (!title) return;
      const li = document.createElement('li');
      li.innerHTML = '<span class="time">新建</span><span class="dot"></span><span></span>';
      li.querySelector('span:last-child').textContent = title;
      document.querySelector('#cal .list').append(li);
      toast.textContent = '已在日历组件添加「' + title + '」（示意）';
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 1800);
    });
  </script>
</body>
</html>
