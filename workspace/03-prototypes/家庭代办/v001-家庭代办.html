<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>LuckyTodo 原型 v001</title>
  <style>
    /* 配色来自已确认的三套皮肤，写成 OKLCH。暖纸和夜航是需求指定的，不是随意换的主题。 */
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body {
      min-height: 100dvh;
      display: grid;
      place-items: center;
      gap: 12px;
      padding: 24px 16px;
      background: oklch(0.3 0.02 264);
      color: oklch(0.92 0.01 264);
      font-family: "PingFang SC", "WenQuanYi Micro Hei", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif;
      font-size: 16px;
      line-height: 1.45;
    }
    .stage-note { margin: 0; font-size: 13px; letter-spacing: 0.01em; }
    #device {
      width: min(400px, 100%);
      height: min(844px, calc(100dvh - 72px));
      position: relative;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      border-radius: 28px;
      border: 1px solid oklch(0.42 0.02 264);
      background: var(--bg);
      color: var(--text);
      touch-action: manipulation;
    }
    #device[data-theme="night"] {
      --bg: oklch(0.178 0.012 264);
      --card: oklch(0.232 0.016 264);
      --text: oklch(0.972 0.006 250);
      --secondary: oklch(0.76 0.02 255);
      --accent: oklch(0.6 0.19 285);
      --on-accent: oklch(0.985 0.004 285);
      --done: oklch(0.82 0.15 163);
      --miss: oklch(0.74 0.18 18);
      --line: color-mix(in oklch, var(--text) 16%, transparent);
      --field: color-mix(in oklch, var(--text) 7%, var(--bg));
      color-scheme: dark;
    }
    #device[data-theme="day"] {
      --bg: oklch(0.972 0.006 264);
      --card: oklch(0.995 0.002 264);
      --text: oklch(0.21 0.015 277);
      --secondary: oklch(0.44 0.02 252);
      --accent: oklch(0.48 0.16 266);
      --on-accent: oklch(0.985 0.004 266);
      --done: oklch(0.48 0.12 162);
      --miss: oklch(0.5 0.18 27);
      --line: color-mix(in oklch, var(--text) 14%, transparent);
      --field: oklch(1 0 0);
      color-scheme: light;
    }
    #device[data-theme="paper"] {
      --bg: oklch(0.955 0.02 88);
      --card: oklch(0.985 0.012 88);
      --text: oklch(0.27 0.03 75);
      --secondary: oklch(0.45 0.04 70);
      --accent: oklch(0.55 0.13 48);
      --on-accent: oklch(0.985 0.01 88);
      --done: oklch(0.46 0.1 152);
      --miss: oklch(0.48 0.15 30);
      --line: color-mix(in oklch, var(--text) 16%, transparent);
      --field: oklch(0.99 0.01 88);
      color-scheme: light;
    }
    #app { flex: 1; min-height: 0; display: flex; flex-direction: column; }
    .screen { flex: 1; min-height: 0; display: flex; flex-direction: column; }
    .top {
      display: flex;
      align-items: center;
      gap: 8px;
      min-height: 56px;
      padding: calc(10px + env(safe-area-inset-top)) 12px 8px;
    }
    .top h1 { flex: 1; margin: 0; font-size: 17px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    #device[data-font="large"] .top h1,
    #device[data-font="large"] .title { font-size: 20px; }
    .scroller { flex: 1; min-height: 0; overflow: auto; overscroll-behavior: contain; padding: 4px 20px 24px; }
    .scroller.pad-tab { padding-bottom: 140px; }
    .searchpad { padding: 0 20px 4px; }
    .scroller.pad-bar { padding-bottom: 108px; }
    h1, h2, p { text-wrap: pretty; }
    h2 { margin: 18px 0 8px; font-size: 13px; font-weight: 600; letter-spacing: 0.04em; color: var(--secondary); }
    .meta { color: var(--secondary); font-size: 13px; }
    #device[data-font="large"] .meta { font-size: 16px; }
    .title { display: block; font-size: 17px; font-weight: 600; }
    .datehead { display: flex; align-items: center; gap: 12px; padding: 4px 0 12px; }
    .daynum { margin: 0; font-size: 32px; line-height: 1; font-weight: 600; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; }
    .grow { flex: 1; }
    .avatar, .iconbtn, .tabs button, .btn, .row, .check, .day, .seg button {
      font: inherit;
      color: inherit;
      cursor: pointer;
    }
    .iconbtn, .avatar {
      width: 44px; height: 44px; flex: 0 0 44px;
      display: grid; place-items: center;
      border: 0; border-radius: 12px;
      background: transparent;
    }
    .avatar { border-radius: 50%; background: var(--card); border: 1px solid var(--line); font-weight: 600; }
    .ico { display: block; }
    .tabs {
      display: flex;
      gap: 4px;
      padding: 4px 8px calc(6px + env(safe-area-inset-bottom));
      border-top: 1px solid var(--line);
      background: var(--bg);
    }
    .tabs button {
      flex: 1;
      min-height: 48px;
      border: 0;
      border-radius: 12px;
      background: transparent;
      color: var(--secondary);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      font-size: 12px;
    }
    #device[data-font="large"] .tabs button { font-size: 14px; }
    .tabs button[aria-current="page"] { color: var(--accent); background: color-mix(in oklch, var(--accent) 14%, transparent); }
    .search { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; }
    .search input { flex: 1; }
    input, textarea, select {
      font: inherit;
      font-size: 16px;
      color: var(--text);
      background: var(--field);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 12px;
      width: 100%;
    }
    textarea { min-height: 96px; resize: vertical; }
    .field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
    .field label { font-size: 13px; color: var(--secondary); }
    #device[data-font="large"] .field label { font-size: 16px; }
    .err { margin: 0; color: var(--miss); font-size: 13px; }
    .row {
      width: 100%;
      min-height: 56px;
      padding: 10px 0;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 2px;
      text-align: left;
      border: 0;
      border-bottom: 1px solid var(--line);
      background: transparent;
    }
    .row .line { width: 100%; display: flex; justify-content: space-between; gap: 8px; align-items: center; }
    .pill {
      flex: 0 0 auto;
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 2px 8px;
      font-size: 12px;
      color: var(--secondary);
    }
    #device[data-font="large"] .pill { font-size: 14px; }
    .pill.done { color: var(--done); }
    .pill.miss, .pill.late { color: var(--miss); }
    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 12px 14px;
      margin: 8px 0 12px;
    }
    .person { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; padding: 8px 0; border-bottom: 1px solid var(--line); }
    .person:last-child { border-bottom: 0; }
    .btn {
      min-height: 48px;
      padding: 12px 16px;
      border-radius: 12px;
      border: 0;
      background: var(--accent);
      color: var(--on-accent);
      font-weight: 600;
      text-align: center;
    }
    .btn.secondary { background: transparent; color: var(--text); border: 1px solid var(--line); }
    .btn.danger { background: transparent; color: var(--miss); border: 1px solid color-mix(in oklch, var(--miss) 50%, var(--line)); }
    .btn:disabled { opacity: 0.5; }
    .col { display: flex; flex-direction: column; gap: 8px; }
    .rowbtns { display: flex; gap: 8px; }
    .rowbtns .btn { flex: 1; }
    .fab {
      position: absolute;
      right: 16px;
      bottom: calc(72px + env(safe-area-inset-bottom));
      width: 56px; height: 56px;
      border: 0; border-radius: 50%;
      background: var(--accent); color: var(--on-accent);
      display: grid; place-items: center;
      z-index: 5;
    }
    .banner {
      display: flex; gap: 8px; align-items: center;
      padding: 10px 12px; margin: 0 0 12px;
      border: 1px solid var(--line); border-radius: 12px; background: var(--card);
    }
    .banner p { margin: 0; flex: 1; }
    .empty { padding: 32px 8px; display: flex; flex-direction: column; gap: 8px; align-items: flex-start; }
    .empty h2 { margin: 0; font-size: 20px; letter-spacing: 0; color: var(--text); }
    .skel { height: 14px; border-radius: 6px; background: var(--line); margin: 14px 0; }
    .skel.w2 { width: 70%; }
    .calhead { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .week, .grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
    .week span { text-align: center; color: var(--secondary); font-size: 12px; padding: 4px 0; }
    .day {
      min-height: 44px;
      border: 0; border-radius: 10px; background: transparent;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
    }
    .day[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); }
    .dot { width: 5px; height: 5px; border-radius: 50%; background: var(--accent); }
    .day[aria-pressed="true"] .dot { background: var(--on-accent); }
    .seg { display: flex; gap: 8px; margin-bottom: 8px; }
    .seg button {
      flex: 1; min-height: 44px; border-radius: 12px;
      border: 1px solid var(--line); background: transparent;
    }
    .seg button[aria-pressed="true"] { background: var(--card); border-color: var(--accent); color: var(--accent); }
    .checks { display: flex; flex-direction: column; gap: 8px; }
    .check {
      min-height: 48px; padding: 8px 12px;
      display: flex; justify-content: space-between; gap: 8px; align-items: center;
      border-radius: 12px; border: 1px solid var(--line); background: transparent; text-align: left;
    }
    .check[aria-pressed="true"] { border-color: var(--accent); background: color-mix(in oklch, var(--accent) 12%, transparent); }
    .days { display: flex; flex-wrap: wrap; gap: 8px; }
    .days button { min-width: 44px; min-height: 44px; border-radius: 12px; border: 1px solid var(--line); background: transparent; }
    .days button[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
    .backdrop {
      position: absolute; inset: 0; z-index: 20;
      background: oklch(0.15 0.01 264 / 0.55);
      display: flex; align-items: flex-end;
    }
    .backdrop.center { align-items: center; justify-content: center; padding: 20px; z-index: 30; }
    .sheet, .dialog {
      background: var(--card); color: var(--text);
      width: 100%; max-height: 82%; overflow: auto;
      border-radius: 18px 18px 0 0;
      padding: 16px 16px calc(16px + env(safe-area-inset-bottom));
      overscroll-behavior: contain;
    }
    .dialog { width: min(320px, 100%); border-radius: 16px; }
    .toast {
      position: absolute; left: 16px; right: 16px; top: calc(64px + env(safe-area-inset-top));
      z-index: 40; pointer-events: none;
      background: var(--card); color: var(--text);
      border: 1px solid var(--line); border-radius: 12px;
      padding: 12px 14px;
    }
    .dock {
      position: absolute; left: 0; right: 0; bottom: 0; z-index: 4;
      padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
      background: color-mix(in oklch, var(--bg) 92%, transparent);
      border-top: 1px solid var(--line);
    }
    .choice { display: flex; gap: 8px; align-items: center; min-height: 44px; }
    .sr {
      position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
      overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0;
    }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    @media (max-width: 480px) {
      body { padding: 0; display: block; background: var(--bg); }
      .stage-note { display: none; }
      #device { width: 100%; height: 100dvh; border: 0; border-radius: 0; }
    }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; transition: none !important; }
    }
    @media (prefers-reduced-motion: no-preference) {
      .skel { animation: pulse 1.2s ease-in-out infinite; }
    }
    @keyframes pulse { 50% { opacity: 0.45; } }
  </style>
</head>
<body>
  <p class="stage-note">LuckyTodo 原型 v001 · 示例数据只保存在这台浏览器</p>
  <div id="device" data-theme="night" data-font="standard">
    <div id="app"></div>
    <p id="live" class="sr" aria-live="polite"></p>
  </div>
  <script>
'use strict';
const KEY = 'luckytodo-proto-v001';
const WEEK = ['日', '一', '二', '三', '四', '五', '六'];
let state;
let focusModal = false;
let toastTimer = 0;
let pull = null;

function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
function pad(n) { return String(n).padStart(2, '0'); }
function todayIso() {
  return new Intl.DateTimeFormat('en-CA', { timeZone: 'Asia/Shanghai', year: 'numeric', month: '2-digit', day: '2-digit' }).format(new Date());
}
function addIso(iso, n) {
  const d = new Date(iso + 'T12:00:00+08:00');
  d.setUTCDate(d.getUTCDate() + n);
  return new Intl.DateTimeFormat('en-CA', { timeZone: 'Asia/Shanghai', year: 'numeric', month: '2-digit', day: '2-digit' }).format(d);
}
function weekday(iso) {
  const name = new Intl.DateTimeFormat('en-US', { timeZone: 'Asia/Shanghai', weekday: 'short' }).format(new Date(iso + 'T12:00:00+08:00'));
  return { Sun: 0, Mon: 1, Tue: 2, Wed: 3, Thu: 4, Fri: 5, Sat: 6 }[name];
}
function weekdayZh(iso) {
  return new Intl.DateTimeFormat('zh-CN', { timeZone: 'Asia/Shanghai', weekday: 'long' }).format(new Date(iso + 'T12:00:00+08:00'));
}
function at(iso, hh, mm) { return iso + 'T' + pad(hh) + ':' + pad(mm) + ':00+08:00'; }
function shDate(value) {
  return new Intl.DateTimeFormat('en-CA', { timeZone: 'Asia/Shanghai', year: 'numeric', month: '2-digit', day: '2-digit' }).format(new Date(value));
}
function shTime(value) {
  return new Intl.DateTimeFormat('en-GB', { timeZone: 'Asia/Shanghai', hour: '2-digit', minute: '2-digit', hourCycle: 'h23' }).format(new Date(value));
}
function toLocal(value) { return value ? shDate(value) + 'T' + shTime(value) : ''; }
function fromLocal(value) { return value ? value.slice(0, 16) + ':00+08:00' : ''; }
function uid(prefix) { return prefix + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
function userById(id) { return state.users.find((u) => u.id === id); }
function me() { return userById(state.sessionUserId); }
function roleName(role) { return { admin: '管理员', parent: '家长', adult: '成人', child: '儿童' }[role] || role; }
function statusName(status) { return { pending: '待执行', done: '已完成', missed: '缺卡', future: '未开始', open: '未完成' }[status] || status; }
function activeUsers() { return state.users.filter((u) => !u.disabled); }
function stackTop() { return state.stack.length ? state.stack[state.stack.length - 1] : null; }

function nextWeekday(iso, target) {
  let d = iso;
  for (let i = 0; i < 7; i += 1) {
    if (weekday(d) === target) return d;
    d = addIso(d, 1);
  }
  return iso;
}

function seed() {
  const today = todayIso();
  const yesterday = addIso(today, -1);
  const tomorrow = addIso(today, 1);
  const friday = nextWeekday(today, 5);
  return {
    route: 'connect',
    tab: 'today',
    stack: [],
    serverUrl: '',
    connectStatus: 'idle',
    connectError: '',
    householdReady: true,
    familyName: '林家',
    sessionUserId: null,
    users: [
      { id: 'linchen', name: '林晨', username: 'linchen', password: 'family1', role: 'admin', disabled: false },
      { id: 'zhouning', name: '周宁', username: 'zhouning', password: 'family1', role: 'parent', disabled: false },
      { id: 'linxiulan', name: '林秀兰', username: 'linxiulan', password: 'family1', role: 'adult', disabled: false },
      { id: 'xiaoman', name: '林小满', username: 'xiaoman', password: 'family1', role: 'child', disabled: false }
    ],
    notes: [
      { id: 'n1', title: '报销材料在书房抽屉', body: '发票在蓝色文件夹。', authorId: 'linchen', visibility: 'private', memberIds: [], pinned: false, linkedTodoId: null, updatedAt: at(today, 9, 10) },
      { id: 'n2', title: '周六买水果', body: '西瓜和葡萄。', authorId: 'linchen', visibility: 'specified', memberIds: ['zhouning'], pinned: true, linkedTodoId: null, updatedAt: at(today, 8, 20) }
    ],
    todos: [
      { id: 't1', title: '交电费', notes: '供电所账单在短信里。', creatorId: 'linchen', due: at(tomorrow, 18, 0), reminderKind: 'due', reminderAt: at(tomorrow, 18, 0), assignees: [{ id: 'linchen', status: 'open', doneAt: null }] }
    ],
    events: [
      { id: 'e1', title: '家长会', creatorId: 'linchen', allday: false, start: at(friday, 15, 0), end: at(friday, 16, 30), participantIds: ['linchen', 'zhouning'], reminderKind: 'm10', reminderAt: at(friday, 14, 50) }
    ],
    plans: [
      {
        id: 'p1', title: '每天阅读 20 分钟', desc: '孩子读完后写一句。', creatorId: 'linchen',
        cycle: { type: 'daily' }, prevCycle: null, cycleEffective: null,
        start: addIso(today, -10), end: '', reminder: '20:00', assigneeIds: ['xiaoman', 'zhouning'],
        archived: false, archivedAt: null,
        records: {
          [today + '|xiaoman']: { status: 'done', feedback: '读了三页', at: at(today, 20, 5) },
          [yesterday + '|zhouning']: { status: 'done', feedback: '读完一章', at: at(yesterday, 21, 0) }
        }
      },
      {
        id: 'p2', title: '每周一三五运动', desc: '各自出门走 30 分钟。', creatorId: 'linchen',
        cycle: { type: 'weekly', weekdays: [1, 3, 5] }, prevCycle: null, cycleEffective: null,
        start: addIso(today, -21), end: '', reminder: '07:30', assigneeIds: ['linchen', 'zhouning'],
        archived: false, archivedAt: null, records: {}
      }
    ],
    prefs: {
      guest: { theme: 'night', font: 'standard' },
      xiaoman: { theme: 'night', font: 'large' }
    },
    search: '',
    noteQuery: '',
    planSegment: 'active',
    calMonth: today.slice(0, 7),
    calSelected: today,
    overlay: null,
    toast: '',
    offline: false,
    failNextSave: false,
    loading: false,
    hydrated: false,
    notif: { decision: null, dismissedAt: null },
    draft: null,
    fieldErrors: {},
    loginUser: '',
    loginPass: '',
    expandedHistory: null
  };
}

function load() {
  try {
    const raw = localStorage.getItem(KEY);
    if (!raw) return seed();
    const data = JSON.parse(raw);
    if (!data.users || !data.plans) return seed();
    data.toast = '';
    data.loading = false;
    data.overlay = null;
    data.fieldErrors = {};
    data.connectStatus = 'idle';
    return data;
  } catch (err) {
    return seed();
  }
}
function save() {
  const copy = JSON.parse(JSON.stringify(state));
  copy.toast = '';
  copy.loading = false;
  copy.overlay = null;
  copy.fieldErrors = {};
  localStorage.setItem(KEY, JSON.stringify(copy));
}
function currentPrefs() {
  const id = state.sessionUserId || 'guest';
  if (!state.prefs[id]) state.prefs[id] = { theme: 'night', font: 'standard' };
  return state.prefs[id];
}

function cycleFor(plan, iso) {
  if (plan.prevCycle && plan.cycleEffective && iso < plan.cycleEffective) return plan.prevCycle;
  return plan.cycle;
}
function occursOn(plan, iso) {
  if (plan.archived && plan.archivedAt && iso >= shDate(plan.archivedAt)) return false;
  if (iso < plan.start) return false;
  if (plan.end && iso > plan.end) return false;
  const cycle = cycleFor(plan, iso);
  if (cycle.type === 'daily') return true;
  if (cycle.type === 'weekly') return cycle.weekdays.includes(weekday(iso));
  if (cycle.type === 'monthly') return Number(iso.slice(8)) === Number(cycle.monthDay);
  if (cycle.type === 'interval') {
    const a = new Date(plan.start + 'T12:00:00+08:00').getTime();
    const b = new Date(iso + 'T12:00:00+08:00').getTime();
    return Math.round((b - a) / 86400000) % cycle.n === 0;
  }
  return false;
}
function entry(plan, iso, userId) {
  const rec = (plan.records || {})[iso + '|' + userId];
  if (rec) return rec;
  const today = todayIso();
  if (iso > today) return { status: 'future', feedback: '' };
  if (iso === today) return { status: 'pending', feedback: '' };
  return { status: 'missed', feedback: '' };
}
function cycleName(cycle) {
  if (!cycle) return '';
  if (cycle.type === 'daily') return '每天';
  if (cycle.type === 'weekly') {
    const days = cycle.weekdays.slice().sort((a, b) => ((a + 6) % 7) - ((b + 6) % 7));
    return '每周' + days.map((d) => WEEK[d]).join('、');
  }
  if (cycle.type === 'monthly') return '每月' + cycle.monthDay + '日';
  return '每' + cycle.n + '天';
}
function canSeeNote(note, user) {
  if (note.authorId === user.id) return true;
  if (note.visibility === 'specified' && note.memberIds.includes(user.id)) return true;
  if (note.visibility === 'family' && user.role !== 'child') return true;
  return false;
}
function canSeeTodo(todo, user) {
  return todo.creatorId === user.id || todo.assignees.some((a) => a.id === user.id);
}
function canSeeEvent(ev, user) {
  return ev.creatorId === user.id || ev.participantIds.includes(user.id);
}
function canSeePlan(plan, user) {

  if ((user.role === 'admin' || user.role === 'parent') && plan.assigneeIds.some((id) => userById(id) && userById(id).role === 'child')) return true;

}
function assignable(user) {

  if (user.role === 'adult') return list.filter((m) => m.role !== 'child');

}
function canEditTodo(todo, user) {

}
function canEditEvent(ev, user) {

function canEditPlan(plan, user) {

function visibleNotes() { return state.notes.filter((n) => canSeeNote(n, me())); }
function myPlansToday() {
  const today = todayIso();
  return state.plans.filter((p) => !p.archived && p.assigneeIds.includes(me().id) && occursOn(p, today));
}
function childRows() {
  const user = me();
  if (user.role !== 'admin' && user.role !== 'parent') return [];
  const today = todayIso();
  const rows = [];
  activeUsers().filter((u) => u.role === 'child').forEach((child) => {
    state.plans.filter((p) => !p.archived && p.assigneeIds.includes(child.id) && occursOn(p, today)).forEach((p) => {
      rows.push({ child, plan: p, status: entry(p, today, child.id).status });

}
function myOpenTodos() {
  const today = todayIso();
  return state.todos.filter((t) => {
    const mine = t.assignees.find((a) => a.id === me().id && a.status === 'open');
    if (!mine) return false;
    if (!t.due) return true;
    return shDate(t.due) <= today;
  });
}
function upcomingEvents() {
  const now = Date.now();
  const limit = now + 48 * 3600 * 1000;
  return state.events.filter((ev) => canSeeEvent(ev, me())).filter((ev) => {
    const start = new Date(ev.start).getTime();
    const end = new Date(ev.end).getTime();
    return end >= now && start <= limit;
  }).sort((a, b) => new Date(a.start) - new Date(b.start)).slice(0, 3);
}
function matchQuery(text) {
  const q = state.search.trim();
  return !q || text.includes(q);
}
function hasFutureReminder(user) {
  const now = Date.now();
  if (state.todos.some((t) => t.reminderAt && new Date(t.reminderAt) > now && t.assignees.some((a) => a.id === user.id))) return true;
  if (state.events.some((ev) => ev.reminderAt && new Date(ev.reminderAt) > now && ev.participantIds.includes(user.id))) return true;
  const today = todayIso();
  return state.plans.some((p) => {
    if (!p.reminder || p.archived || !p.assigneeIds.includes(user.id)) return false;
    for (let i = 0; i < 14; i += 1) {
      const iso = addIso(today, i);
      if (occursOn(p, iso) && new Date(at(iso, Number(p.reminder.slice(0, 2)), Number(p.reminder.slice(3)))) > now) return true;
    }
    return false;
  });
}
function dayItems(iso) {
  const user = me();
  const items = [];
  state.events.filter((ev) => canSeeEvent(ev, user) && shDate(ev.start) === iso).forEach((ev) => {
    items.push({ type: 'event', id: ev.id, title: ev.title, meta: ev.allday ? '全天' : shTime(ev.start) + '–' + shTime(ev.end), sort: ev.start });
  });
  state.todos.filter((t) => canSeeTodo(t, user) && t.due && shDate(t.due) === iso).forEach((t) => {
    const mine = t.assignees.find((a) => a.id === user.id);
    items.push({ type: 'todo', id: t.id, title: t.title, meta: mine ? statusName(mine.status === 'done' ? 'done' : 'open') : '待办', sort: t.due });
  });
  state.plans.filter((p) => canSeePlan(p, user) && occursOn(p, iso)).forEach((p) => {
    let meta = cycleName(cycleFor(p, iso));

    else meta = p.assigneeIds.filter((id) => userById(id).role === 'child').map((id) => userById(id).name + statusName(entry(p, iso, id).status)).join('、');

  return items.sort((a, b) => String(a.sort).localeCompare(String(b.sort)));
}

function planDetail() {
  const plan = state.plans.find((p) => p.id === stackTop().id);
  const user = me();
  if (!plan || !canSeePlan(plan, user)) return missing();
  const today = todayIso();
  const occurs = occursOn(plan, today);
  let people = '<div class="card">';
  plan.assigneeIds.forEach((id) => {
    const rec = occurs ? entry(plan, today, id) : { status: 'future', feedback: '' };
    people += '<div class="person"><div><p class="title">' + esc(userById(id).name) + '</p><p class="meta">' + esc(rec.feedback || '') + '</p></div>' + pill(rec.status) + '</div>';
  });
  people += '</div>';
  const mine = plan.assigneeIds.includes(user.id) ? entry(plan, today, user.id) : null;
  const canCheck = occurs && mine && mine.status === 'pending' && !plan.archived;
  let history = '<h2>以往周期</h2>';
  const past = [];
  let d = addIso(today, -1);
  let guard = 0;
  while (d >= plan.start && past.length < 8 && guard < 120) {
    if (occursOn(plan, d) || (plan.records && Object.keys(plan.records).some((k) => k.startsWith(d + '|')))) past.push(d);
    d = addIso(d, -1);
    guard += 1;
  }
  if (!past.length) history += '<p class="meta">还没有过去的周期。</p>';
  past.forEach((iso) => {
    const open = state.expandedHistory === iso;
    history += '<button type="button" class="row" data-act="expand-history" data-id="' + iso + '" aria-expanded="' + open + '"><span class="title">' + Number(iso.slice(5, 7)) + '月' + Number(iso.slice(8)) + '日</span></button>';

      plan.assigneeIds.forEach((id) => {
        const rec = entry(plan, iso, id);
        history += '<div class="person"><span>' + esc(userById(id).name) + '</span>' + pill(rec.status) + '</div>';
      });
    }
  });
  const edit = canEditPlan(plan, user) && !plan.archived ? '<button type="button" class="btn secondary" data-act="edit-plan" data-id="' + plan.id + '">编辑</button>' : '';
  const archive = canEditPlan(plan, user) && !plan.archived ? '<button type="button" class="btn danger" data-act="ask-archive" data-id="' + plan.id + '">归档计划</button>' : '';
  const next = !occurs ? '<p class="meta">今天不是打卡日。</p>' : '';
  return stackHead(plan.title, '') + '<div class="scroller' + (canCheck ? ' pad-bar' : '') + '" id="scroller"><p class="meta">' + esc(cycleName(plan.cycle)) + (plan.reminder ? ' · ' + plan.reminder + ' 提醒' : ' · 不提醒') + '</p><p>' + esc(plan.desc || '') + '</p>' + next + '<h2>本周期</h2>' + people + history + '<div class="col" style="margin-top:16px">' + edit + archive + '</div></div>' + (canCheck ? '<div class="dock"><button type="button" class="btn" data-act="open-checkin" data-id="' + plan.id + '">完成打卡</button></div>' : '');
}

function todoDetail() {
  const todo = state.todos.find((t) => t.id === stackTop().id);
  if (!todo || !canSeeTodo(todo, me())) return missing();
  const user = me();
  let people = '';
  todo.assignees.forEach((a) => {
    const who = userById(a.id);
    const mine = a.id === user.id;
    people += '<div class="person"><div><p class="title">' + esc(who.name) + '</p><p class="meta">' + esc(a.status === 'done' ? '已完成' : (todo.due && shDate(todo.due) < todayIso() ? '已过期' : '未完成')) + '</p></div>' + (mine ? '<button type="button" class="btn secondary" data-act="toggle-my-todo" data-id="' + todo.id + '">' + (a.status === 'done' ? '改回未完成' : '我完成了') + '</button>' : pill(a.status === 'done' ? 'done' : 'open')) + '</div>';

function render() {

  const scroller = document.getElementById('scroller');
  const scrollTop = scroller ? scroller.scrollTop : 0;
  const active = document.activeElement;
  const focusId = active && active.closest && active.closest('#app') ? active.id : '';
  const selStart = active ? active.selectionStart : null;
  const selEnd = active ? active.selectionEnd : null;
  let main = '';
  if (state.route !== 'main') main = appHtml();
  else {
    const page = stackTop();
    const map = { today: todayHtml, cal: calendarHtml, plans: plansHtml, notes: notesHtml, profile: profileHtml, members: membersHtml, 'member-form': memberForm, password: passwordHtml, 'note-form': noteForm, 'todo-form': todoForm, 'event-form': eventForm, 'plan-form': planForm, 'plan-detail': planDetail, 'note-detail': noteDetail, 'todo-detail': todoDetail, 'event-detail': eventDetail };
    const name = page ? page.name : state.tab;
    const inner = (map[name] || todayHtml)();
    const withTabs = !page && inner.indexOf('class="tabs"') === -1;
    main = inner + (withTabs ? tabbar() : '') + overlayHtml() + toastHtml();
  }
  document.getElementById('app').innerHTML = main;
  const live = document.getElementById('live');
  if (live) live.textContent = state.toast || '';
  const nextScroller = document.getElementById('scroller');
  if (nextScroller) nextScroller.scrollTop = scrollTop;
  if (focusModal) {
    focusModal = false;
    const modal = document.querySelector('[data-modal="1"]');
    const item = modal && modal.querySelector('button, input, textarea, select');
    if (item) item.focus();
  } else if (focusId) {
    const el = document.getElementById(focusId);
    if (el) {
      el.focus();
      if (typeof selStart === 'number' && el.setSelectionRange) {
        try { el.setSelectionRange(selStart, selEnd); } catch (err) { /* 日期控件不支持选区 */ }
      }
    }
  }
}

}

function reminderFromTodo(draft) {
  if (draft.reminderKind === 'none') return null;
  if (draft.reminderKind === 'custom') return draft.customReminder ? fromLocal(draft.customReminder) : null;
  if (!draft.due) return null;
  const due = fromLocal(draft.due);
  if (draft.reminderKind === 'due') return due;
  return new Date(new Date(due).getTime() - 3600000).toISOString();
}
function reminderFromEvent(draft) {
  if (draft.reminderKind === 'none') return null;
  if (draft.allday) {
    const day = draft.date;
    if (draft.reminderKind === 'day9') return at(day, 9, 0);
    if (draft.reminderKind === 'prev9') return at(addIso(day, -1), 9, 0);
    return null;
  }
  if (!draft.start) return null;
  const start = fromLocal(draft.start);
  if (draft.reminderKind === 'start') return start;
  const ms = draft.reminderKind === 'm10' ? 10 * 60000 : 3600000;
  return new Date(new Date(start).getTime() - ms).toISOString();
}

    const idx = arr.indexOf(day);
    if (idx >= 0) arr.splice(idx, 1); else arr.push(day);
    state.draft.weekdays = arr;
    state.draft.dirty = true;
    render();
  },
  'expand-history': function (el) {
    state.expandedHistory = state.expandedHistory === el.dataset.id ? null : el.dataset.id;
    render();
  },
  'cal-prev': function () {
    const [y, m] = state.calMonth.split('-').map(Number);
    const d = m === 1 ? (y - 1) + '-12' : y + '-' + pad(m - 1);
    state.calMonth = d;
    render();
  },
  'cal-next': function () {
    const [y, m] = state.calMonth.split('-').map(Number);
    state.calMonth = m === 12 ? (y + 1) + '-01' : y + '-' + pad(m + 1);
    render();
  },
  'cal-today': function () { state.calMonth = todayIso().slice(0, 7); state.calSelected = todayIso(); render(); },
  'cal-day': function (el) { state.calSelected = el.dataset.id; render(); },
  'plan-segment': function (el) { state.planSegment = el.dataset.id; render(); },
  theme: function (el) { currentPrefs().theme = el.dataset.id; save(); render(); },
  font: function (el) { currentPrefs().font = el.dataset.id; save(); render(); },
  logout: function () { state.sessionUserId = null; state.route = 'login'; state.stack = []; state.draft = null; save(); render(); },
  'ask-server': function () { openOverlay({ type: 'confirm', title: '更换服务器', body: '更换后需要重新登录。', yesLabel: '更换', yes: 'do-server', danger: true }); },
  'do-server': function () { state.sessionUserId = null; state.route = 'connect'; state.stack = []; save(); render(); },
  'open-password': function () { state.draft = { current: '', next: '', again: '', dirty: false }; push('password'); },
  'save-password': function () {
    const d = state.draft;
    const err = {};
    if (d.current !== me().password) err.current = '当前密码不正确';
    if (!d.next || d.next.length < 6 || d.next.length > 64) err.next = '新密码需要 6–64 位';
    if (d.next !== d.again) err.again = '两次密码不一致';
    state.fieldErrors = err;
    if (Object.keys(err).length) { render(); return; }
    if (!canSave()) return;
    me().password = d.next;
    state.draft = null;
    save();
    pop();
    toast('密码已更新');
  },
  'open-members': function () { push('members'); },
  'open-member': function (el) {
    const u = userById(el.dataset.id);
    state.draft = { id: u.id, name: u.name, username: u.username, password: '', role: u.role, disabled: u.disabled, isNew: false, dirty: false };
    push('member-form');
  },
  'new-member': function () {
    state.draft = { id: null, name: '', username: '', password: '', role: 'adult', disabled: false, isNew: true, dirty: false };
    push('member-form');
  },
  'save-member': function () {
    const d = state.draft;
    const err = {};
    if (!d.name || d.name.length > 20) err.name = '显示名需要 1–20 字';
    if (!/^[a-z0-9]{3,20}$/.test(d.username || '')) err.username = '用户名用 3–20 位小写字母或数字';
    if (state.users.some((u) => u.username === d.username && u.id !== d.id)) err.username = '这个用户名已经有人用了';
    if (d.isNew && (!d.password || d.password.length < 6)) err.password = '初始密码需要 6–64 位';
    if (!d.isNew && d.password && d.password.length < 6) err.password = '新密码需要 6–64 位';
    state.fieldErrors = err;
    if (Object.keys(err).length) { render(); return; }
    if (!canSave()) return;
    if (d.isNew) state.users.push({ id: uid('u'), name: d.name.trim(), username: d.username, password: d.password, role: d.role, disabled: false });
    else {
      const u = userById(d.id);
      u.name = d.name.trim();
      u.username = d.username;
      if (d.id !== me().id) u.role = d.role;
      if (d.password) u.password = d.password;
    }
    state.draft = null;
    save();
    pop();
    toast('已保存成员');
  },
  'ask-disable': function (el) { openOverlay({ type: 'confirm', title: '停用这个成员？', body: '停用后不能登录，已有打卡记录会保留。', yesLabel: '停用', yes: 'do-disable', id: el.dataset.id, danger: true }); },
  'do-disable': function (el) {
    const u = userById(el.dataset.id);
    u.disabled = true;
    if (state.draft && state.draft.id === u.id) state.draft.disabled = true;
    save();
    toast('已停用');
  },
  'enable-member': function (el) {
    const u = userById(el.dataset.id);
    u.disabled = false;
    if (state.draft) state.draft.disabled = false;
    save();
    toast('已恢复');
  },
  'toggle-offline': function () { state.offline = !state.offline; save(); toast(state.offline ? '已模拟连接中断' : '已恢复连接'); },
  'toggle-fail': function () { state.failNextSave = !state.failNextSave; save(); render(); },
  'ask-reset': function () { openOverlay({ type: 'confirm', title: '重置演示数据？', body: '这台浏览器里的修改会清掉，示例家庭会回来。', yesLabel: '重置', yes: 'do-reset', danger: true }); },
  'do-reset': function () { localStorage.removeItem(KEY); state = seed(); render(); toast('已恢复示例家庭'); },
  'goto-today': function () { state.stack = []; state.tab = 'today'; state.route = 'main'; render(); },
  'notif-allow': function () { state.notif.decision = 'granted'; state.overlay = null; save(); toast('到点会提醒一次'); },
  'notif-deny': function () { state.notif.decision = 'denied'; state.overlay = null; save(); render(); },
  'open-notif': function () { openOverlay({ type: 'notif' }); },
  'dismiss-banner': function () { state.notif.dismissedAt = Date.now(); save(); render(); }
};

document.getElementById('app').addEventListener('click', (e) => {
  const el = e.target.closest('[data-act]');
  if (!el || el.tagName === 'FORM') {
    if (e.target.classList && e.target.classList.contains('backdrop')) closeOverlay();
    return;
  }
  const act = el.dataset.act;
  if (el.closest('form') && el.type === 'submit') return;
  if (actions[act]) actions[act](el, e);
});
document.getElementById('app').addEventListener('submit', (e) => {
  e.preventDefault();
  const act = e.target.dataset.act;
  if (actions[act]) actions[act](e.target, e);
});
document.getElementById('app').addEventListener('input', (e) => {
  const bind = e.target.dataset.bind;
  if (!bind) return;
  setBind(bind, e.target.type === 'checkbox' ? e.target.checked : e.target.value);
  if (e.target.dataset.render === '1') render();
});
document.getElementById('app').addEventListener('change', (e) => {
  const bind = e.target.dataset.bind;
  if (!bind) return;
  setBind(bind, e.target.type === 'checkbox' ? e.target.checked : e.target.value);
  if (e.target.dataset.render === '1') render();
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && state.overlay) { e.preventDefault(); closeOverlay(); return; }
  if (e.key !== 'Tab' || !state.overlay) return;
  const root = document.querySelector('[data-modal="1"]');
  if (!root) return;
  const items = Array.from(root.querySelectorAll('button, input, textarea, select')).filter((el) => !el.disabled);
  if (!items.length) return;
  const first = items[0];
  const last = items[items.length - 1];
  if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
  else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
});
document.addEventListener('pointerdown', (e) => {
  const scroller = document.getElementById('scroller');
  if (!scroller || !scroller.contains(e.target) || scroller.scrollTop > 0) return;
  if (e.target.closest('button, input, textarea, select, a, label')) return;
  pull = { y: e.clientY, id: e.pointerId };
});
document.addEventListener('pointerup', (e) => {
  if (!pull || pull.id !== e.pointerId) return;
  const dy = e.clientY - pull.y;
  pull = null;
  if (dy > 72 && state.route === 'main' && !stackTop() && (state.tab === 'today' || state.tab === 'notes' || state.tab === 'plans' || state.tab === 'cal')) actions.refresh();
});

state = load();
render();
window.__LT = { get state() { return state; }, todayIso, addIso };
  </script>
